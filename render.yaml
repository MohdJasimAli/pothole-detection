# Render.com blueprint - deploys the FULL Python project (backend + dashboard).
# Create the service from your GitHub repo at https://render.com/blueprints
services:
  - type: web
    name: pothole-detection-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt && pytest tests/ -q
    startCommand: waitress-serve --host=0.0.0.0 --port=$PORT api.app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: API_DEBUG
        value: "false"
      - key: FLASK_SECRET_KEY
        generateValue: true