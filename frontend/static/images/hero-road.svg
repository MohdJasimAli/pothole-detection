<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#74b9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dfe6e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#636e72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3436;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="600" height="180" fill="url(#sky)"/>

  <!-- Road -->
  <polygon points="0,180 600,180 480,400 120,400" fill="url(#road)"/>

  <!-- Center dashed line -->
  <rect x="296" y="200" width="8" height="30" fill="#fdcb6e" rx="2"/>
  <rect x="296" y="250" width="8" height="35" fill="#fdcb6e" rx="2"/>
  <rect x="296" y="305" width="8" height="40" fill="#fdcb6e" rx="2"/>
  <rect x="296" y="365" width="8" height="35" fill="#fdcb6e" rx="2"/>

  <!-- Pothole 1 (detected - red box) -->
  <ellipse cx="200" cy="300" rx="42" ry="20" fill="#1e272e"/>
  <ellipse cx="200" cy="298" rx="36" ry="15" fill="#000"/>
  <rect x="150" y="272" width="104" height="58" fill="none" stroke="#e74c3c" stroke-width="3" rx="4"/>
  <rect x="150" y="252" width="86" height="18" fill="#e74c3c" rx="3"/>
  <text x="156" y="265" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">CRITICAL</text>

  <!-- Pothole 2 (detected - orange box) -->
  <ellipse cx="400" cy="340" rx="28" ry="13" fill="#2d3436"/>
  <ellipse cx="400" cy="339" rx="23" ry="10" fill="#000"/>
  <rect x="366" y="320" width="70" height="42" fill="none" stroke="#e67e22" stroke-width="3" rx="4"/>
  <rect x="366" y="300" width="70" height="18" fill="#e67e22" rx="3"/>
  <text x="372" y="313" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold">HIGH</text>

  <!-- AI detection indicator -->
  <circle cx="560" cy="30" r="8" fill="#00b894">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="35" font-family="Arial, sans-serif" font-size="13" fill="#2d3436" font-weight="bold">AI Active</text>
</svg>